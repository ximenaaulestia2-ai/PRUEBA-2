<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Madre – cuento interactivo</title>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d2733;--bg2:#2c3e50;--paper:#fbf3e0;--ink:#2b2320;--red:#b3262e;--gold:#c9971c;--blue:#2f6f9f;--green:#3f7d4e;--ui:#fbf3e0}
@media (prefers-color-scheme:dark){:root{--bg:#10171f;--bg2:#1d2a38}}
:root[data-theme="light"]{--bg:#1d2733;--bg2:#2c3e50}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:linear-gradient(var(--bg),var(--bg2));color:var(--ink);font-family:'Patrick Hand','Comic Sans MS',cursive;font-size:19px;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.snow i{position:absolute;top:-10px;color:#fff;opacity:.7;animation:f linear infinite}
@keyframes f{to{transform:translateY(105vh) translateX(30px)}}
#top{width:100%;max-width:600px;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;color:var(--ui);z-index:2}
#top b{font-family:Chewy,cursive;font-size:20px;letter-spacing:1px}
button{font-family:Chewy,cursive;font-size:18px;border:0;border-radius:24px;padding:8px 16px;background:var(--gold);color:#2b1b00;cursor:pointer;box-shadow:0 3px 0 #7a5a0c}
button:active{transform:translateY(2px);box-shadow:none}
button:disabled{opacity:.35}
#stage{flex:1;width:100%;max-width:600px;padding:0 12px;min-height:0;z-index:1}
.page{height:100%;background:var(--paper);border-radius:10px;padding:22px 24px;overflow-y:auto;position:relative;box-shadow:0 8px 24px #0008;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateX(30px)}}
.page:before,.page:after{content:"";position:absolute;width:70px;height:12px;background:repeating-linear-gradient(45deg,#e4b93a,#a8790f 4px);border-radius:3px}
.page:before{top:8px;right:8px;box-shadow:58px 0 0 -0px transparent}
.page:after{bottom:8px;left:8px}
h1,h2,h3{font-family:Chewy,cursive;font-weight:400;margin:.2em 0;text-align:center;line-height:1.1}
h1{font-size:46px}h2{font-size:34px}h3{font-size:24px;color:var(--red)}
.t span:nth-child(4n+1){color:var(--red)}.t span:nth-child(4n+2){color:var(--blue)}.t span:nth-child(4n+3){color:var(--gold)}.t span:nth-child(4n){color:var(--green)}
.t span{display:inline-block;text-shadow:2px 2px 0 #0002;transition:transform .2s}.t span:hover{transform:rotate(-10deg) scale(1.2)}
p{line-height:1.45;margin:.6em 0}
img.d{display:block;margin:10px auto;max-width:70%;max-height:230px;border-radius:12px;border:3px solid var(--gold);background:#fff}
.sep{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:100%;background:radial-gradient(circle,#f5e1b8,var(--paper))}
.sep .n{font-family:Chewy,cursive;font-size:110px;color:var(--red);text-shadow:4px 4px 0 var(--gold);line-height:1}
.card{background:#fff8;border:2px dashed var(--gold);border-radius:14px;padding:8px 14px;margin:8px 0}
.card b{color:var(--red)}
.w{border-bottom:2px dotted var(--blue);color:var(--blue);cursor:help}
#tip{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;max-width:88%;display:none;z-index:5;font-size:17px}
#nav{width:100%;max-width:600px;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:var(--ui);z-index:2}
.idx{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center}
.idx button{padding:4px 12px;font-size:17px}.idx button.off{background:#cdbf9f;box-shadow:none;color:#6b5f48}
.ph{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.q{background:var(--red);color:#fff;border-radius:14px;padding:12px 16px;margin:10px 0;cursor:pointer;text-align:center;transition:.2s}
.q.on{background:var(--gold);color:#2b1b00;transform:scale(1.03)}
svg.il{display:block;margin:6px auto}
</style></head><body>
<div class="snow" id="snow"></div>
<div id="top"><b>★ La Madre ★</b><button id="bi">Índice</button></div>
<div id="stage"></div>
<div id="tip"></div>
<div id="nav"><button id="bp">◀ Atrás</button><span id="pn"></span><button id="bn">Siguiente ▶</button></div>

'<div class="page" style="text-align:center">'+dome+'<h1 class="t">'+[...'LA MADRE'].map(c=>c==' '?' ':'<span>'+c+'</span>').join('')+'</h1><h3 style="color:#2b2320">Máximo Gorki</h3><div style="display:flex;justify-content:center;gap:6px">'+I('madre')+I('obrero')+'</div><p><b>Nombre:</b> Dorian Chiluiza<br><b>Grado:</b> Séptimo “B”</p><div class="card"><b>¡El alma no muere! ¡La razón no se apaga! ¡La verdad vencerá!</b></div></div>',
'<div class="page">'+T('Pequeña reseña')+book+'<p>«La Madre» es un libro de finales del siglo XIX y principios del siglo XX. Cuenta la dura situación que vivían las familias de economía media y baja por el abuso de los que más tenían, y cómo se vulneraban sus derechos.</p><p>También cuenta cómo, con un poco de preparación y conocimiento, hicieron respetar y cumplir esos derechos a toda costa, sin importar si ponían en riesgo sus vidas.</p><p>Toca las palabras con línea azul para descubrir qué significan. Por ejemplo: '+W('clandestinas','secretas, escondidas para que nadie las descubra')+'.</p></div>',
'<div class="page">'+T('Conoce al autor')+flag+'<p><b>Máximo Gorki</b> es el nombre de pluma de un escritor ruso. En su idioma, «gorki» significa «amargo».</p><p>Escribió «La Madre» en <b>1906</b>. Su mensaje principal es que tomar conciencia de clase y luchar juntos es el único camino para superar la opresión social.</p><div class="card">Dato extra: nació en 1868 y murió en 1936 (dato de cultura general, no está en el trabajo original).</div></div>',
'<div class="page">'+T('Ficha técnica')+fact+'<div class="card"><b>Título:</b> La Madre<br><b>Autor:</b> Máximo Gorki<br><b>Género:</b> Narrativo<br><b>Lugar donde ocurre:</b> Imperio Ruso, Tormoro<br><b>Tiempo:</b> Finales del siglo XIX y principios del siglo XX<br><b>Personajes principales:</b> Pelagia Nilovna, Pavel Vlásov, Mijaíl Vlásov<br><b>Tema central:</b> La toma de conciencia social, política y la evolución de una persona oprimida hacia una activista revolucionaria.</div></div>',
'<div class="page" style="text-align:center">'+T('Dedicatoria')+star+'<p style="font-size:23px">Esta novela la dedico a las personas que creyeron en mí y a las personas que les gusta la lectura y luchan por sus derechos.</p>'+star+'</div>',
'<div class="page">'+T('Índice')+'<div class="idx" id="ix"></div></div>',
sep(1,'La historia comienza',dome),
'<div class="page"><h3>Capítulo 1</h3><p>La historia comienza tras la muerte del esposo de Pelagia, Mijaíl Vlásov, un obrero alcohólico y violento.</p><p>Su hijo Pavel Vlásov experimenta un cambio radical: deja de beber, empieza a leer libros prohibidos y se convierte en líder de la causa socialista en la fábrica donde trabaja.</p><p>Al principio, Pelagia vive con miedo y desconocimiento ante las reuniones '+W('clandestinas','secretas, escondidas para que nadie las descubra')+' que Pavel organiza en su casa con otros jóvenes obreros.</p><p>Con el tiempo, el amor por su hijo y el contacto con sus compañeros hacen que empiece a entender sus ideales de justicia y libertad.</p>'+flake+'</div>',
sep(2,'Pelagia entra en acción',fact),
'<div class="page"><h3>Capítulo 2</h3><p>Pelagia poco a poco se va involucrando en las reuniones de su hijo con sus compañeros de partido, a los cuales acaba tratando y considerando como si fueran sus propios hijos. Pelagia no es solo la madre de Pavel, sino también de todos sus compañeros, de toda la causa que defienden, como considera de sus actividades políticas.</p><p>Pavel es detenido por la policía '+W('zarista','del zar, el emperador que gobernaba Rusia en esa época')+'. A partir de ese momento, Pelagia deja de comportarse como una mera espectadora y comienza a colaborar activamente en las actividades del partido: llevando '+W('pasquines','hojas con mensajes que se reparten a escondidas')+' a la fábrica de su hijo, transportando periódicos ilegales a las zonas rurales y transmitiendo a campesinos y trabajadores la ideología socialista aprendida de su hijo, a la que ella da un tinte religioso: desde su punto de vista, religión y socialismo definen el reinado de las clases humildes.</p>'+flag+'</div>',
sep(3,'El juicio',book),
'<div class="page"><h3>Capítulo 3</h3><p>Durante el juicio a los revolucionarios, Pavel pronuncia un ardiente '+W('alegato','un discurso para defender sus ideas ante el tribunal')+' socialista frente al tribunal zarista. Aunque él es condenado al '+W('exilio','obligado a vivir lejos de su tierra')+' en Siberia, Pelagia es detenida y golpeada. Pero la conciencia de clase es incontenible, y la lucha colectiva del '+W('proletariado','las personas trabajadoras')+' continúa.</p><h3>✨ Enseñanza</h3><div class="card"><p>Lo que debemos hacer las personas en la actualidad es luchar siempre por nuestros ideales, pero siempre evitando utilizar la fuerza bruta. Para ello debemos ser conscientes de que nuestra preparación constante es ser capaces de solucionar problemas.</p></div></div>',
...cp,

'<div class="page">'+T('Secretos de mi novela')+book+'<div class="card"><p>La novela «La madre» (1906), escrita por Máximo Gorki, deja como mensaje principal que la toma de conciencia de clase y la lucha colectiva son el único camino para superar la opresión social.</p></div></div>',
'<div class="page">'+T('Personaje favorito')+I('pavel')+'<div class="card"><p>Mi personaje favorito es Pavel Vlásov porque era un joven que luchó por la verdad y por la libertad, no solo de él, sino de todo su pueblo.</p></div></div>',
